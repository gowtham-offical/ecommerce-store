<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Cart — Modern Goods</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="nav-brand">Modern<span>Goods</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Shop</a>
      <a href="cart.html">Cart <span class="nav-cart-count" id="navCartCount" style="display:none;">0</span></a>
      <span id="navAuthLinks"></span>
    </div>
  </div>
</nav>

<main class="container">
  <h1 class="section-title" style="margin-top:32px;">Your Cart</h1>
  <div class="cart-layout">
    <div id="cartItems">
      <p class="loading-text">Loading cart...</p>
    </div>

    <div class="cart-summary" id="cartSummaryContent">
      <h3>Order Summary</h3>
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="summarySubtotal">$0.00</span>
      </div>
      <div class="summary-row">
        <span>Shipping</span>
        <span>Free</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span id="summaryTotal">$0.00</span>
      </div>
      <br />
      <a href="checkout.html" class="btn btn-primary btn-block">Proceed to Checkout</a>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    &copy; 2026 Modern Goods. Built as a demo e-commerce project.
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script>
  document.getElementById('navToggle').addEventListener('click', () => {
    document.getElementById('navLinks').classList.toggle('open');
  });
</script>
</body>
</html>
